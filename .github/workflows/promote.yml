name: Promote
run-name: Promote ${{ inputs.ref }} → ${{ inputs.environment }} (by @${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to promote (tag or commit SHA). Must be reachable from main.'
        required: true
        type: string
        default: main
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - uat
          - production

permissions:
  contents: read

jobs:
  promote:
    name: Promote ${{ inputs.ref }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.promote.outputs.sha }}
      noop: ${{ steps.promote.outputs.noop }}

    steps:
      - name: Generate app token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.WATERFALL_CLIENT_ID }}
          private-key: ${{ secrets.WATERFALL_APP_PRIVATE_KEY }}

      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Promote ${{ inputs.ref }} → ${{ inputs.environment }}
        id: promote
        run: ./scripts/promote.sh "${{ inputs.ref }}" "${{ inputs.environment }}"

  notify:
    name: 'Notify #deploys'
    needs: promote
    if: ${{ always() && needs.promote.outputs.noop != 'true' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Post to Slack
        uses: mirurobotics/.github/actions/notify-deploys@f28d0cc569b006bee3e4600f3653f1f3772ec09f # main
        with:
          webhook-url: ${{ secrets.SLACK_DEPLOYS_WEBHOOK_URL }}
          application: Docs
          version: ${{ needs.promote.outputs.sha || inputs.ref }}
          environment: ${{ inputs.environment }}
          link: >-
            ${{ inputs.environment == 'production'
            && 'https://docs.mirurobotics.com/getting-started/welcome'
            || format('https://miru-{0}.mintlify.site/getting-started/welcome',
            inputs.environment) }}
          results: ${{ needs.promote.result }}
