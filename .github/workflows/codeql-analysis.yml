name: CodeQL

on:
  push:
    branches:
      - main
      - staging
      - uat
      - production
  schedule:
    - cron: '31 7 * * 3'
  workflow_call:

permissions:
  actions: read
  checks: write
  contents: read
  security-events: write

jobs:
  # The job id below is part of the code-scanning category
  # (".github/workflows/codeql-analysis.yml:codeql"). Renaming it or adding a
  # matrix orphans the old category as a stale "results may be out of date"
  # configuration under Security > Code scanning > Tools. After such a change,
  # update the default keep category in scripts/codeql-prune.sh and run it to
  # prune the old one.
  codeql:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Initialize CodeQL
        id: initialize
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          config-file: .github/codeql/codeql-config.yml
          languages: javascript

      - name: Autobuild
        id: autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4

      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
