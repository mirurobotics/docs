          description: The file system destinations this config schema writes to.
            Every config schema has at least one slot. Slots share the schema's validation
            and differ only in where the file is written; a file needing different
            validation is a different config type, not a slot. Slot keys and filepaths
            must each be unique within the schema, and slot filepaths must be unique
            across every config schema in a release.
          items:
            $ref: '#/components/schemas/InstanceSlot'
          example:
          - key: default
            name: Default
            filepath: /srv/miru/configs/v1/motion-control.json
            required: true
        instance_format:
          $ref: '#/components/schemas/InstanceFormat'
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the config schema was created.
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the config schema was last updated.
        config_type_id:
          type: string
          example: cfg_typ_123
          description: ID of the config type.
        language:
          $ref: '#/components/schemas/SchemaLanguage'
        format:
          $ref: '#/components/schemas/SchemaFormat'
        documents:
          allOf:
          - $ref: '#/components/schemas/SchemaDocuments'
          description: Expand the config schema documents using `expand=documents`
            in the query string.
          example:
          - id: doc_123
            name: main.json
            data: |
              {
                "$schema": "https://json-schema.org/draft/2020-12/schema",
                "type": "object"
              }
