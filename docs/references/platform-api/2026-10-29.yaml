        last_disconnected_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          nullable: true
          description: Timestamp of when the device was last disconnected (this is
            not the same as the last time the device was seen).
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the device was created.
        updated_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the device was last updated.
    Deployment:
      title: Deployment
      allOf:
      - $ref: '#/components/schemas/BaseDeployment'
      - type: object
        required:
        - parent_id
        - queued_at
        - deployed_at
        - archived_at
        properties:
          parent_id:
            type: string
            nullable: true
            example: dpl_123
            description: ID of the deployment that this deployment was patched from.
              Null if this deployment has no parent.
          queued_at:
            type: string
            format: date-time
            example: '2021-01-01T00:00:00Z'
            nullable: true
            description: Timestamp of when a principal last queued the deployment,
              i.e. requested that it be deployed to its device. Device status reports
              do not change it.
          deployed_at:
            type: string
            format: date-time
            example: '2021-01-01T00:00:00Z'
            nullable: true
            description: Timestamp of the last time the device's agent confirmed that
              the deployment was deployed. Set by the agent. A watermark of the latest
              transition; it is not cleared when the deployment later changes state.
          archived_at:
            type: string
            format: date-time
            example: '2021-01-01T00:00:00Z'
            nullable: true
            description: Timestamp of the last time the device's agent confirmed that
              the deployment was archived. Set by the agent. A watermark of the latest
              transition; it is not cleared when the deployment later changes state.
          device:
            allOf:
            - $ref: '#/components/schemas/Device'
            description: Expand the device using 'expand=device' in the query string.
          release:
            allOf:
            - $ref: '#/components/schemas/Release'
            description: Expand the release using 'expand=release' in the query string.
          parent:
            allOf:
            - $ref: '#/components/schemas/Deployment'
            nullable: true
            description: The parent deployment that this deployment was patched from.
              Null if this deployment has no parent. Expand the parent using 'expand=parent'
              in the query string.
          config_instances:
            type: array
            items:
              $ref: '#/components/schemas/ConfigInstance'
            description: Expand the config instances using 'expand=config_instances'
              in the query string.
            example:
            - object: config_instance
              id: cfg_inst_123
              config_type_name: Motion Control
              filepath: /srv/miru/configs/v1/motion-control.json
              slot_key: default
              created_at: '2021-01-01T00:00:00Z'
              config_schema_id: cfg_sch_123
              config_type_id: cfg_typ_123
            - object: config_instance
              id: cfg_inst_124
              config_type_name: Localization
              filepath: /srv/miru/configs/v1/localization/primary.json
              slot_key: primary
              created_at: '2021-01-01T00:00:00Z'
