components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: The API key to use for authentication.
  schemas:
    APIVersion:
      type: string
      enum:
      - 2026-10-29.everglades
      x-enum-varnames:
      - API_VERSION
      x-stainless-const: true
    ReleaseVersion:
      type: string
      enum:
      - 2026-10-29.everglades
      x-enum-varnames:
      - RELEASE_VERSION
      x-stainless-const: true
    APIGitCommit:
      type: string
      enum:
      - fa872feb1c97431ace4e4f5636eea0856b5d73f3
      x-enum-varnames:
      - API_GIT_COMMIT
      x-stainless-const: true
    CalSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - device_id
      - component
      - role
      - aspect
      - serial_number
      - report_id
      x-enum-varnames:
      - CAL_SEARCH_DEVICE_ID
      - CAL_SEARCH_COMPONENT
      - CAL_SEARCH_ROLE
      - CAL_SEARCH_ASPECT
      - CAL_SEARCH_SERIAL_NUMBER
      - CAL_SEARCH_REPORT_ID
    CfgInstSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - config_schema_id
      - config_type_id
      - slot_key
      x-enum-varnames:
      - CFG_INST_SEARCH_ID
      - CFG_INST_SEARCH_CONFIG_SCHEMA_ID
      - CFG_INST_SEARCH_CONFIG_TYPE_ID
      - CFG_INST_SEARCH_SLOT_KEY
    CfgSchSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - config_type_id
      x-enum-varnames:
      - CFG_SCH_SEARCH_ID
      - CFG_SCH_SEARCH_CONFIG_TYPE_ID
    CfgTypeSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - name
      - slug
      x-enum-varnames:
      - CFG_TYPE_SEARCH_ID
      - CFG_TYPE_SEARCH_NAME
      - CFG_TYPE_SEARCH_SLUG
    DplSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - target_status
      - activity_status
      - error_status
      - device_id
      - release_id
      x-enum-varnames:
      - DPL_SEARCH_ID
      - DPL_SEARCH_TARGET_STATUS
      - DPL_SEARCH_ACTIVITY_STATUS
      - DPL_SEARCH_ERROR_STATUS
      - DPL_SEARCH_DEVICE_ID
      - DPL_SEARCH_RELEASE_ID
    DvcSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - name
      - agent_version
      - current_release_id
      - group_id
      - status
      x-enum-varnames:
      - DVC_SEARCH_ID
      - DVC_SEARCH_NAME
      - DVC_SEARCH_AGENT_VERSION
      - DVC_SEARCH_CURRENT_RELEASE_ID
      - DVC_SEARCH_GROUP_ID
      - DVC_SEARCH_STATUS
    GitCmtSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - sha
      x-enum-varnames:
      - GIT_CMT_SEARCH_ID
      - GIT_CMT_SEARCH_SHA
    GrpSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - name
      - parent_id
      x-enum-varnames:
      - GRP_SEARCH_ID
      - GRP_SEARCH_NAME
      - GRP_SEARCH_PARENT_ID
    RlsSearch:
      type: string
      description: |
        **Internal server use only**: an enum of possible search fields.
      enum:
      - id
      - version
      x-enum-varnames:
      - RLS_SEARCH_ID
      - RLS_SEARCH_VERSION
    CalibrationExpansion:
      type: string
      enum:
      - content
      x-enum-varnames:
      - CALIBRATION_EXPAND_CONTENT
    InstanceFormat:
      title: Instance Format
      type: string
      description: |
        The serialization format of config content. A config instance is written to the device filesystem in this format.
        - `json`: standard JSON.
        - `yaml`: YAML 1.2.
        - `jsonc`: JSON with comments (JSON plus `//` and `/* */` comment syntax).
        - `xml`: XML.
        - `csv`: comma-separated values (RFC 4180).
        - `text`: plain, unstructured text with no specific format.
      enum:
      - json
      - yaml
      - jsonc
      - xml
      - csv
      - text
      x-enum-varnames:
      - INSTANCE_FORMAT_JSON
      - INSTANCE_FORMAT_YAML
      - INSTANCE_FORMAT_JSONC
      - INSTANCE_FORMAT_XML
      - INSTANCE_FORMAT_CSV
      - INSTANCE_FORMAT_TEXT
    InstanceContent:
      title: Instance Content
      type: object
      required:
      - format
      - data
      properties:
        format:
          $ref: '#/components/schemas/InstanceFormat'
        data:
          type: string
          description: The content's values, serialized in `format`.
          example: |
            {
              "enable_autonomy": true,
              "enable_remote_control": true,
              "max_payload_kg": 10.0
            }
      example:
        format: json
        data: |
          {
            "enable_autonomy": true,
            "enable_remote_control": true,
            "max_payload_kg": 10.0
          }
    Calibration:
      title: Calibration
      type: object
      description: One calibration reported by a device for a unit of a component.
        Calibrations are immutable and append-only; a device's history is kept per
        component, role, and aspect. Content is at most 1 MiB.
      required:
      - object
      - id
      - device_id
      - component
      - role
      - aspect
      - serial_number
      - digest
      - report_id
      - reported_at
      - created_at
      properties:
        object:
          type: string
          enum:
          - calibration
          example: calibration
          x-stainless-const: true
          description: The object type, which is always `calibration`.
        id:
          type: string
          example: cal_123
          description: ID of the calibration, generated by Miru.
        device_id:
          type: string
          example: dvc_123
          description: ID of the device that reported the calibration.
        component:
          type: string
          example: arm
          description: Slug of the component the calibrated unit belongs to, as it
            was reported.
        role:
          type: string
          nullable: true
          example: front-left
          description: Slug of the role the calibrated unit fills on the device, as
            it was reported; null if no role was reported.
        aspect:
          type: string
          nullable: true
          example: pose
          description: Slug of the aspect of the unit that was calibrated, as it was
            reported; null if no aspect was reported.
        serial_number:
          type: string
          nullable: true
          maxLength: 255
          example: SN-1234
          description: Serial number of the physical unit that was calibrated, not
            of the device, such as `SN-1234`, or null if none was reported. Free text,
            at most 255 characters.
        digest:
          type: string
          example: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
          description: Digest of the content, formatted as `sha256:` followed by 64
            lowercase hex characters.
        report_id:
          type: string
          format: uuid
          example: 0b6f3c2e-6a51-4e0f-9a43-2f1d7c9e8b10
          description: ID the agent gave the report this calibration came from.
        reported_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when the calibration was reported to the agent
            on the device. The agent may upload it much later, for example after an
            outage, so this can be well before `created_at`.
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: Timestamp of when Miru recorded the calibration.
        content:
          allOf:
          - $ref: '#/components/schemas/InstanceContent'
          description: The calibration's content. Expand using `expand=content` in
            the query string.
      example:
        object: calibration
        id: cal_123
        device_id: dvc_123
        component: arm
        role: front-left
        aspect: null
        serial_number: SN-1234
        digest: sha256:e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
        report_id: 0b6f3c2e-6a51-4e0f-9a43-2f1d7c9e8b10
        reported_at: '2021-01-01T00:00:00Z'
        created_at: '2021-01-01T00:00:00Z'
        content:
          format: json
          data: |
            {
              "x": 0.412,
              "y": -0.087,
              "z": 0.256,
              "roll": 0.0,
              "pitch": 0.0,
              "yaw": 1.571
            }
    CalibrationOrderBy:
      type: string
      enum:
      - id:asc
      - id:desc
      - created_at:asc
      - created_at:desc
      - reported_at:asc
      - reported_at:desc
      x-enum-varnames:
      - CALIBRATION_ORDER_BY_ID_ASC
      - CALIBRATION_ORDER_BY_ID_DESC
      - CALIBRATION_ORDER_BY_CREATED_AT_ASC
      - CALIBRATION_ORDER_BY_CREATED_AT_DESC
      - CALIBRATION_ORDER_BY_REPORTED_AT_ASC
      - CALIBRATION_ORDER_BY_REPORTED_AT_DESC
      default: created_at:desc
    CalibrationListExpansion:
      type: string
      enum:
      - content
      - total_count
      x-enum-varnames:
      - CALIBRATION_LIST_EXPAND_CONTENT
      - CALIBRATION_LIST_EXPAND_TOTAL_COUNT
    PaginatedList:
      title: Paginated List
      type: object
      required:
      - object
      - limit
      - offset
      - has_more
      properties:
        object:
          type: string
          enum:
          - list
          example: list
          x-stainless-const: true
          description: The object type, which is always `list`.
        total_count:
          type: integer
          format: int64
          description: The total number of items in the list. By default the total
            count is not returned. The total count must be expanded (using expand=total_count)
            to get the total number of items in the list.
        limit:
          type: integer
          description: The maximum number of items to return. A limit of 15 with an
            offset of 0 returns items 1-15.
          default: 10
          minimum: 1
          maximum: 100
        offset:
          type: integer
          description: The offset of the items to return. An offset of 10 with a limit
            of 10 returns items 11-20.
          default: 0
          minimum: 0
        has_more:
          type: boolean
          description: True if there are more items in the list to return. False if
            there are no more items to return.
          example: false
    CalibrationList:
      title: Calibration List
      allOf:
      - $ref: '#/components/schemas/PaginatedList'
      - type: object
        required:
        - data
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/Calibration'
            description: The list of calibrations.
    ConfigInstanceExpansion:
      type: string
      enum:
      - content
      - config_schema
      - config_type
      x-enum-varnames:
      - CONFIG_INSTANCE_EXPAND_CONTENT
      - CONFIG_INSTANCE_EXPAND_CONFIG_SCHEMA
      - CONFIG_INSTANCE_EXPAND_CONFIG_TYPE
    BaseConfigInstance:
      title: Base Config Instance
      type: object
      required:
      - object
      - id
      - config_type_name
      - filepath
      - created_at
      - config_schema_id
      - config_type_id
      - slot_key
      properties:
        object:
          type: string
          enum:
          - config_instance
          example: config_instance
          x-stainless-const: true
          description: The object type, which is always `config_instance`.
        id:
          type: string
          example: cfg_inst_123
          description: ID of the config instance.
        config_type_name:
          type: string
          example: Motion Control
          description: The name of the config type.
        filepath:
          type: string
          example: /srv/miru/configs/v1/motion-control.json
          description: The absolute file system path where this config instance is
            written.
        slot_key:
          type: string
          example: controller_2
          description: The key of the config schema slot this instance is bound to.
            Must match the `key` of one of the slots declared by this instance's config
            schema.
        created_at:
          type: string
          format: date-time
          example: '2021-01-01T00:00:00Z'
          description: The timestamp of when the config instance was created.
        config_schema_id:
          type: string
          example: cfg_sch_123
          description: ID of the config schema which the config instance must adhere
            to.
        config_type_id:
          type: string
          example: cfg_type_123
          description: ID of the config type which the config instance (and its schema)
            is a part of.
    OS:
      title: OS
      type: string
      description: |
        An operating system family, from the agent's build-time OS vocabulary. Shared across resources (devices, config schemas, file rules, releases). This is the machine-readable OS kind, distinct from a human-readable version string.
        - `linux`
        - `windows`
      example: linux
      enum:
      - linux
      - windows
      x-enum-varnames:
      - OS_LINUX
      - OS_WINDOWS
    InstanceSlot:
      title: Instance Slot
      type: object
      required:
      - key
      - name
      - filepath
      - required
      properties:
        key:
          type: string
          pattern: ^[a-z0-9][a-z0-9_-]*$
          maxLength: 128
          example: controller_2
          description: An immutable, code-friendly identifier for this slot, unique
            within the schema. Lowercase alphanumerics, underscores, and hyphens;
            must start with an alphanumeric; at most 128 characters.
        name:
          type: string
          example: Controller 2
          description: The human-readable name of this slot.
        filepath:
          type: string
          example: /var/local/forge/configuration/robot_drivers/controller_2/topic_list.yaml
          description: The absolute file system path where instances bound to this
            slot are written. Must be unique within the schema, and unique across
            every config schema in a release.
        required:
          type: boolean
          example: true
          description: Whether every deployment of a release containing this schema
            must include an instance for this slot. A deployment includes at most
            one config instance per slot.
        description:
          type: string
          example: Topic list for the second motor controller.
          description: An optional human-readable description of this slot.
      example:
        key: controller_2
        name: Controller 2
        filepath: /var/local/forge/configuration/robot_drivers/controller_2/topic_list.yaml
        required: true
        description: Topic list for the second motor controller.
    SchemaLanguage:
      title: Schema Language
      type: string
      example: jsonschema
      enum:
      - jsonschema
      - cue
      - opaque
      x-enum-varnames:
      - JSONSCHEMA
      - CUE
      - OPAQUE
    SchemaFormat:
      title: Schema Format
      type: string
      enum:
      - json
      - yaml
      - cue
      x-enum-varnames:
      - SCHEMA_FORMAT_JSON
      - SCHEMA_FORMAT_YAML
      - SCHEMA_FORMAT_CUE
    SchemaDocument:
      title: Schema Document
      type: object
      required:
      - id
      - name
      - data
      properties:
        id:
          type: string
          description: The unique identifier for this document.
          example: doc_123
        name:
          type: string
          description: The document filename.
          example: main.json
        data:
          type: string
          description: The raw document content.
      example:
        id: doc_123
        name: main.json
        data: |
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "type": "object"
          }
    SchemaDocuments:
      type: array
      items:
        $ref: '#/components/schemas/SchemaDocument'
      example:
      - id: doc_123
        name: main.json
        data: |
          {
            "$schema": "https://json-schema.org/draft/2020-12/schema",
            "type": "object"
          }
    BaseConfigSchema:
      title: Base Config Schema
      type: object
      required:
      - object
      - id
      - digest
      - os
      - config_type_name
      - instance_format
      - created_at
      - updated_at
      - config_type_id
      - language
      - format
      - instance_slots
      properties:
        object:
          type: string
          enum:
          - config_schema
          example: config_schema
          x-stainless-const: true
          description: The object type, which is always `config_schema`.
        id:
          type: string
          example: cfg_sch_123
          description: ID of the config schema.
        digest:
          type: string
          example: sha256:1234567890
          description: The digest of the config schema.
        os:
          allOf:
          - $ref: '#/components/schemas/OS'
          readOnly: true
          description: 'The operating system family this config schema targets, derived
            from its instance slot filepaths, which must all agree. A schema created
            without `instance_slots` gets a default slot at a Unix path, so it is
            `linux`. Read-only: clients cannot set it.'
        config_type_name:
          type: string
