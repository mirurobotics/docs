openapi: 3.0.3
info:
  title: Miru Platform API
  description: The API between Miru and any external client
  version: 2026-10-29.everglades
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-release-version: 2026-10-29.everglades
  x-git-commit:
    sha: fa872feb1c97431ace4e4f5636eea0856b5d73f3
    url: https://github.com/mirurobotics/openapi/commit/fa872feb1c97431ace4e4f5636eea0856b5d73f3
    message: |-
      feat(platform)!: name calibration components, roles and aspects by slug (#387)

      <!-- claude-projects-attribution: {"github_login":"miru-agents"} -->
      _Requested by **bens-agent** · [project
      thread](https://claude.ai/code/project/chan_015imaa8aZrnubYZcZCvjeHx?thread=cmsg_015imaa8aZrnubYZcZCvjeHxSn3iZUCfXbnPXdJcNFrg4t)_

      ## Summary

      `platform/2026-10-28.everglades` exposed components, component roles and
      component aspects as their own resources, so a caller has to look up
      workspace-specific IDs before it can filter calibrations by the slugs
      devices report. Monarch's pull script spends about 25 lines doing
      exactly that. None of the three has a lifecycle of its own in the API
      (Miru creates them from device reports, never deletes them, and their
      slugs are immutable and unique in their scope), so this release reduces
      the platform calibration surface to `calibrations` alone.

      **Calibration**
      - `component_id`, `role_id` and `aspect_id` become `component`, `role`
      and `aspect` slugs, as reported.
      - The filters are now the `component`, `role` and `aspect` slugs,
      replacing the three ID filters.
      - `external_user_id` (formerly `operator_id`) and its filter are
      removed. The platform API has no resource it can resolve to, and it is
      null on every calibration today.
      - `deployment_id` is removed.
      - The platform `Calibration` is now a standalone schema instead of
      `allOf` the shared `BaseCalibration`, since `allOf` cannot drop fields.

      **Removed**
      - `GET /components`, `GET /components/{id}`, `GET /component_roles`,
      `GET /component_roles/{id}`, `GET /component_aspects` and `GET
      /component_aspects/{id}`, with their schemas.
      - The `components:read`, `component_roles:read` and
      `component_aspects:read` scopes.
      - The Stainless `components`, `component_roles` and `component_aspects`
      resources.

      The Frontend API is unchanged: the UI still lists and renames
      components, roles and aspects by ID.

      ## Precedent

      - The standalone `Calibration` with `component`/`role`/`aspect` slugs
      matches the device `Calibration` in #370 field for field, apart from the
      platform-only `device_id`.
      - The slug filters use the same names and shapes as #370's
      `calibration_search_component`, `_role` and `_aspect`. They are defined
      locally in the platform path file, as every other platform calibration
      filter already is.

      ## Reviewer notes

      - **Breaking change on a stable release.** Release it as a new date on
      the everglades train. The only known caller is Monarch's
      `pull_calibrations.py` (`miru-platform-sdk==0.12.0`), which gets
      simpler: it filters by `component`/`aspect` slug directly and drops its
      components lookup.
      - **Lost for now:** a way to list which components, roles and aspects
      exist, and their display names. Both can come back later as additive
      resources if a customer needs them.
      - **#386 has merged.** `main` is merged in; the conflict was #386's
      rename of the platform `operator_id`, which this PR removes. #386's
      rename has not been released on the platform, so the next platform tag
      carries one breaking change.
      - Source edits and `./scripts/regen.sh` output are in separate commits.

      ## Follow-ups

      1. Backend: vendor the spec, return component, role and aspect slugs on
      platform calibrations, add the slug filters, drop `deployment_id` from
      the platform response, remove the six component, role and aspect
      handlers, and retire the three scopes. Also delete the `operator_id`
      exception in `TestCalSearchSubset`
      (`internal/servers/platform/everglades/enums/calibrations_test.go`) and
      the response's `OperatorId` mapping in
      `internal/servers/platform/everglades/response/calibration.go`, both
      added for the still-vendored filter ([backend#1062
      review](https://github.com/mirurobotics/backend/pull/1062#discussion_r4408839619)).
      2. Release `miru-platform-sdk`, update `pull_calibrations.py`, and note
      the break in the docs changelog.

      🤖 Generated with [Claude Code](https://claude.com/claude-code)

      https://claude.ai/code/session_01XHScKX3mRGnkVeJheLfkx3

      ---------

      Co-authored-by: Claude <noreply@anthropic.com>
