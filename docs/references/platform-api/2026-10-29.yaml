                required: true
              - key: secondary
                name: Secondary
                filepath: /srv/miru/configs/v1/localization/secondary.json
                required: false
              instance_format: json
              created_at: '2021-01-01T00:00:00Z'
              updated_at: '2021-01-01T00:00:00Z'
              config_type_id: cfg_typ_124
              language: jsonschema
              format: json
