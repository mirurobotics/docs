    CreateDeploymentTargetStatus:
      type: string
      description: |
        Desired state of the deployment.

        `staged` means the deployment is ready for deployment. Deployments can only be staged if their release is not the device's current release.

        `deployed` means the deployment should be deployed to the device. Deployments can only be deployed if their release is the device's current release.
      enum:
      - staged
      - deployed
      x-enum-varnames:
      - CREATE_STAGED_DEPLOYMENT
      - CREATE_DEPLOYED_DEPLOYMENT
    CreateDeploymentRequest:
      title: Create Deployment Request
      type: object
      required:
      - target_status
      - description
      - release_id
      - device_id
      - config_instance_ids
      properties:
        target_status:
          $ref: '#/components/schemas/CreateDeploymentTargetStatus'
        description:
          type: string
          description: The description of the deployment.
          example: Deployment for the motion control config instance
        release_id:
          type: string
          description: The release ID which this deployment adheres to.
          example: rls_123
        parent_id:
          type: string
          nullable: true
          description: |
            Parent deployment ID used as an optimistic-concurrency token. Tristate:
            - omitted: server fills with the device's current `target_deployment_id`; no concurrency check.
            - null: caller asserts the device has no current target; 409 if it does.
            - value: caller asserts the device's current target equals this ID; 409 if it does not match.
          example: dpl_123
        device_id:
          type: string
          description: The ID of the device that the deployment is being created for.
          example: dvc_123
        config_instance_ids:
          type: array
          description: The IDs of the config instances to deploy. A deployment must
            include config instances according to the config schemas slots defined
            in the release.
          items:
            type: string
            example: cfg_inst_123
