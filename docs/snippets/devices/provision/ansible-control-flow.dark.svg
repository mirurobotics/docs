<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" role="img" aria-label="Provision role control flow: install or upgrade the agent, stop if already provisioned, otherwise create a token and provision the device">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#A1A1AA" stroke="none"/>
    </marker>
  </defs>

  <g fill="#0A0A0A" stroke="#27272A" stroke-width="1">
    <rect x="40" y="24" width="300" height="32" rx="6"/>
    <polygon points="190,68 268,136 190,204 112,136"/>
    <rect x="40" y="232" width="300" height="32" rx="6"/>
    <rect x="40" y="296" width="300" height="32" rx="6"/>
    <rect x="120" y="360" width="140" height="32" rx="6"/>
    <rect x="312" y="120" width="88" height="32" rx="6"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#FAFAFA" letter-spacing="-0.13" text-anchor="middle" dominant-baseline="middle">
    <text x="190" y="40">Install or upgrade miru-agent</text>
    <text x="190" y="129">Already</text>
    <text x="190" y="145">provisioned?</text>
    <text x="190" y="248">Create a provisioning token</text>
    <text x="190" y="312">Provision the device with the token</text>
    <text x="190" y="376">Done</text>
    <text x="356" y="136">Done</text>
  </g>

  <g stroke="#A1A1AA" stroke-width="1.25" fill="none" color="#A1A1AA">
    <line x1="190" y1="56" x2="190" y2="68" marker-end="url(#arrow)"/>
    <line x1="268" y1="136" x2="306" y2="136" marker-end="url(#arrow)"/>
    <line x1="190" y1="204" x2="190" y2="232" marker-end="url(#arrow)"/>
    <line x1="190" y1="264" x2="190" y2="296" marker-end="url(#arrow)"/>
    <line x1="190" y1="328" x2="190" y2="360" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#A1A1AA" dominant-baseline="middle">
    <text x="287" y="126" text-anchor="middle">Yes</text>
    <text x="200" y="216" text-anchor="start">No</text>
  </g>
</svg>
