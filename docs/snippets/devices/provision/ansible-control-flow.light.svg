<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 640" width="100%" role="img" aria-label="Provision role control flow: install or upgrade the agent, skip if already provisioned, otherwise create a token, create the device in Miru if needed, and activate it">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#71717A" stroke="none"/>
    </marker>
  </defs>

  <g fill="#FFFFFF" stroke="#D4D4D8" stroke-width="1">
    <rect x="40" y="24" width="300" height="32" rx="6"/>
    <polygon points="190,68 268,136 190,204 112,136"/>
    <rect x="312" y="120" width="88" height="32" rx="6"/>
    <rect x="40" y="232" width="300" height="32" rx="6"/>
    <polygon points="190,292 268,360 190,428 112,360"/>
    <rect x="40" y="456" width="300" height="32" rx="6"/>
    <rect x="40" y="536" width="300" height="32" rx="6"/>
    <rect x="120" y="600" width="140" height="32" rx="6"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="500" fill="#18181B" letter-spacing="-0.13" text-anchor="middle" dominant-baseline="middle">
    <text x="190" y="40">Install or upgrade miru-agent</text>
    <text x="190" y="129">Already</text>
    <text x="190" y="145">provisioned?</text>
    <text x="356" y="136">Done</text>
    <text x="190" y="248">Create a provisioning token</text>
    <text x="190" y="353">Exists</text>
    <text x="190" y="369">in Miru?</text>
    <text x="190" y="472">Create in Miru</text>
    <text x="190" y="552">Activate in Miru</text>
    <text x="190" y="616">Done</text>
  </g>

  <g stroke="#71717A" stroke-width="1.25" fill="none" color="#71717A">
    <line x1="190" y1="56" x2="190" y2="68" marker-end="url(#arrow)"/>
    <line x1="268" y1="136" x2="306" y2="136" marker-end="url(#arrow)"/>
    <line x1="190" y1="204" x2="190" y2="232" marker-end="url(#arrow)"/>
    <line x1="190" y1="264" x2="190" y2="292" marker-end="url(#arrow)"/>
    <line x1="190" y1="428" x2="190" y2="456" marker-end="url(#arrow)"/>
    <path d="M 268 360 L 400 360 L 400 512 L 190 512"/>
    <line x1="190" y1="488" x2="190" y2="536" marker-end="url(#arrow)"/>
    <line x1="190" y1="568" x2="190" y2="600" marker-end="url(#arrow)"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" fill="#52525B" dominant-baseline="middle">
    <text x="287" y="126" text-anchor="middle">Yes</text>
    <text x="200" y="216" text-anchor="start">No</text>
    <text x="200" y="440" text-anchor="start">No</text>
    <text x="334" y="350" text-anchor="middle">Yes</text>
  </g>
</svg>
